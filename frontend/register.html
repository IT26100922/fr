<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Meet students who share your interests, find a study partner, join a community, and build something together."><title>Create your account — IT Friend Finder</title><link rel="icon" href="/assets/images/favicon.svg"><link rel="stylesheet" href="/assets/css/style.css"><link rel="preload" href="/assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin><script type="module" src="/assets/js/auth.js"></script></head><body data-page="register"><a class="skip-link" href="#main">Skip to content</a><main id="main" class="auth-layout"><header class="auth-story"><a class="brand" href="/"><span class="brand-mark">ff</span><span>IT Friend Finder</span></a></header><section class="auth-content"><div class="auth-form"><h1>Create your account</h1><p>Choose your interests after you register.</p><div id="notice" class="notice" role="alert"></div><form method="post" action="/api/register"><div class="field"><label for="fullName">Full name</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="100"></div><div class="form-grid"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]{3,30}" title="3–30 letters, digits or underscores"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="160"></div></div><div class="field"><label for="password">Password · at least 8 characters</label><div class="password-control"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="btn" type="button" data-password="password" aria-pressed="false" aria-label="Show password">Show</button></div></div><div class="field"><label for="confirmPassword">Confirm password</label><div class="password-control"><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="btn" type="button" data-password="confirmPassword" aria-pressed="false" aria-label="Show confirmation password">Show</button></div></div><button class="btn primary" type="submit" data-loading="Creating account…">Create account</button></form><p class="auth-bottom">Already have an account? <a class="text-link" href="/login.html">Log in</a></p><button class="btn small" data-theme-toggle type="button">Dark theme</button></div></section></main></body></html>
